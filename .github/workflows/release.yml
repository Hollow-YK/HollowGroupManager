name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 版本目录列表（硬编码），手写存档步骤会遍历这些目录
  EDITIONS: 'QFun OneBot11'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version info
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # 预发布判定
          if [[ "$VERSION" =~ alpha|beta|rc|dev|preview ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # ── 更新记录：由约定式提交（Conventional Commits）自动生成 ──
      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ steps.meta.outputs.prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 手写历史存档（history.txt）：降级为补充，无对应版本段落时自动省略 ──
      - name: Extract legacy notes from history.txt
        run: |
          VERSION="V${{ steps.meta.outputs.version }}"
          : > /tmp/legacy_notes.md

          for edition in $EDITIONS; do
            [ -f "${edition}/history.txt" ] || continue

            section=$(awk -v ver="${VERSION}" '
              $0 ~ "^" ver "[ (]" { found=1; next }
              found && /^V[0-9]/       { exit }
              found && /^---/          { next }
              found                    { sub(/^▸ /, "- "); print }
            ' "${edition}/history.txt")

            if [ -n "$section" ]; then
              echo "### ${edition}" >> /tmp/legacy_notes.md
              echo "" >> /tmp/legacy_notes.md
              printf '%s\n\n' "$section" >> /tmp/legacy_notes.md
            fi
          done

          echo "Extracted legacy notes:"
          cat /tmp/legacy_notes.md

      - name: Compose final release body
        run: |
          {
            # PRIMARY: 约定式提交生成的 changelog
            if [ -s CHANGES.md ]; then
              cat CHANGES.md
            else
              # FALLBACK: git-cliff 失败或为空时回退到 git log
              PREV_TAG=$(git tag --sort=-v:refname | sed -n "/^${{ github.ref_name }}$/{n;p}")
              echo "## ${{ steps.meta.outputs.version }} ($(date +%Y-%m-%d))"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                git log "${PREV_TAG}..HEAD" --format="- %s" --no-merges
              else
                git log --format="- %s" --no-merges
              fi
            fi

            # SUPPLEMENTARY: 手写历史存档，折叠显示
            if [ -s /tmp/legacy_notes.md ]; then
              echo ""
              echo "---"
              echo ""
              echo "<details>"
              echo "<summary>📜 历史手写记录</summary>"
              echo ""
              cat /tmp/legacy_notes.md
              echo "</details>"
            fi
          } > /tmp/release_body.md

          echo "Final release body:"
          cat /tmp/release_body.md

      - name: Create QFun release archive
        run: |
          mkdir -p dist/多群管理Bot
          cp QFun/main.java       dist/多群管理Bot/
          cp QFun/info.prop       dist/多群管理Bot/
          cp QFun/README.md       dist/多群管理Bot/
          cp QFun/desc.txt        dist/多群管理Bot/
          cp QFun/config.properties dist/多群管理Bot/
          cd dist
          zip -r "../HollowGroupManager_QFun-${{ steps.meta.outputs.version }}.zip" 多群管理Bot

      - name: Create OneBot11 release archive
        run: |
          mkdir -p dist/HollowGroupManager
          cp OneBot11/main.py           dist/HollowGroupManager/
          cp OneBot11/requirements.txt  dist/HollowGroupManager/
          cp OneBot11/README.md         dist/HollowGroupManager/
          cp OneBot11/LICENSE           dist/HollowGroupManager/
          cp -r OneBot11/bot            dist/HollowGroupManager/
          cp -r OneBot11/core           dist/HollowGroupManager/
          cp -r OneBot11/features       dist/HollowGroupManager/
          cp -r OneBot11/tools          dist/HollowGroupManager/
          find dist/HollowGroupManager -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          cd dist
          zip -r "../HollowGroupManager_OneBot11-${{ steps.meta.outputs.version }}.zip" HollowGroupManager

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: V${{ steps.meta.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            HollowGroupManager_QFun-${{ steps.meta.outputs.version }}.zip
            HollowGroupManager_OneBot11-${{ steps.meta.outputs.version }}.zip
          prerelease: ${{ steps.meta.outputs.prerelease }}
